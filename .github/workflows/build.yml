name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_COMPILE_SDK_VERSION: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 is unmaintained and fails trying to install the
      # long-removed legacy "tools" package, so the Android SDK is set up by hand here: download
      # the official command-line tools and use sdkmanager directly for exactly what's needed.
      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK platform, build-tools and NDK
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          # `yes` is killed by SIGPIPE once sdkmanager stops reading (all licenses accepted),
          # which trips `pipefail` even though nothing actually went wrong - ignore that.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build terminal-emulator, terminal-view and shell
        run: ./gradlew :terminal-emulator:assembleDebug :terminal-view:assembleDebug :shell:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :terminal-emulator:testDebugUnitTest :shell:testDebugUnitTest --stacktrace

      - name: Build app (debug APK)
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: hashFiles('app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: termaterial-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
