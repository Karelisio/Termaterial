name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the debug-APK release below

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_COMPILE_SDK_VERSION: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 is unmaintained and fails trying to install the
      # long-removed legacy "tools" package, so the Android SDK is set up by hand here: download
      # the official command-line tools and use sdkmanager directly for exactly what's needed.
      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm cmdline-tools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK platform, build-tools and NDK
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          # `yes` is killed by SIGPIPE once sdkmanager stops reading (all licenses accepted),
          # which trips `pipefail` even though nothing actually went wrong - ignore that.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build terminal-emulator, terminal-view and shell
        run: ./gradlew :terminal-emulator:assembleDebug :terminal-view:assembleDebug :shell:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :terminal-emulator:testDebugUnitTest :shell:testDebugUnitTest --stacktrace

      - name: Build app (debug APK)
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug --stacktrace

      # The pty is spawned through libtermux.so (terminal-emulator's ndkBuild output). If it were
      # missing from the APK, System.loadLibrary() would throw UnsatisfiedLinkError deep inside
      # TerminalView's layout pass at runtime - so assert it is packaged, for every ABI, here.
      - name: Check native libraries are packaged in the APK
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          echo "APK: $APK"
          unzip -l "$APK" | grep '\.so$' || true
          if ! unzip -l "$APK" | grep -q 'lib/.*/libtermux\.so'; then
            echo "::error::libtermux.so is missing from the APK - the pty JNI library was not packaged."
            exit 1
          fi

      - name: Upload debug APK
        if: hashFiles('app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: termaterial-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Actions artifacts require a signed-in GitHub session and expire after 90 days; a Release
      # asset is a stable, directly downloadable link anyone with repo access can open in a
      # browser - easier to fetch on a phone. One release per branch, its APK replaced each push.
      - name: Publish debug APK to a release
        if: github.event_name == 'push' && hashFiles('app/build.gradle.kts') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-$(echo "${{ github.ref_name }}" | tr '/' '-')"
          NOTES="APK debug généré automatiquement par la CI à chaque push réussi sur \`${{ github.ref_name }}\`. Commit : ${{ github.sha }}."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
              --title "Termaterial debug ($TAG)" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
